<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="24" font-weight="700" fill="#111827">Simple CRM — Technical Architecture</text>
  <text x="60" y="68" font-size="13" fill="#6B7280">NTU AI Engineering · Lesson 2.3 — Unidirectional Data Flow &amp; Conditional Rendering · React 19 + Vite</text>

  <!-- Entry -->
  <rect x="60" y="100" width="200" height="84" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="80" y="126" font-size="15" font-weight="700" fill="#111827">index.html / main.jsx</text>
  <text x="80" y="148" font-size="11" fill="#6B7280">createRoot · StrictMode</text>
  <text x="80" y="166" font-size="11" fill="#6B7280">mounts &lt;App /&gt;</text>

  <!-- Data source -->
  <rect x="60" y="240" width="200" height="96" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="80" y="266" font-size="15" font-weight="700" fill="#111827">mockData.js</text>
  <text x="80" y="288" font-size="11" fill="#6B7280">mockCustomers — 5 seed records</text>
  <text x="80" y="308" font-size="11" fill="#6B7280">generateCustomerId()</text>

  <!-- App container -->
  <rect x="340" y="100" width="460" height="340" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="360" y="128" font-size="16" font-weight="700" fill="#111827">App.jsx</text>
  <text x="428" y="128" font-size="12" fill="#6B7280">container (smart) component — no props</text>

  <text x="360" y="158" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">STATE · useState</text>
  <rect x="360" y="166" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="399" y="183" font-size="11" fill="#3730A3" text-anchor="middle">customers</text>
  <rect x="446" y="166" width="46" height="26" rx="13" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="469" y="183" font-size="11" fill="#3730A3" text-anchor="middle">form</text>
  <rect x="500" y="166" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="540" y="183" font-size="11" fill="#3730A3" text-anchor="middle">searchTerm</text>
  <rect x="588" y="166" width="108" height="26" rx="13" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="642" y="183" font-size="11" fill="#3730A3" text-anchor="middle">selectedCustomer</text>
  <rect x="704" y="166" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="740" y="183" font-size="11" fill="#3730A3" text-anchor="middle">showForm</text>

  <text x="360" y="222" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">DERIVED · computed each render, never stored</text>
  <rect x="360" y="230" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="525" y="249" font-size="11.5" fill="#334155" text-anchor="middle">filteredCustomers = customers.filter( searchTerm )</text>

  <text x="360" y="290" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">HANDLERS · event → immutable setState</text>
  <text x="360" y="310" font-size="11.5" fill="#374151">handleChange · handleTagToggle</text>
  <text x="360" y="328" font-size="11.5" fill="#374151">handleAddCustomer · handleDeleteCustomer</text>

  <text x="360" y="358" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">INLINE UI · conditional rendering</text>
  <text x="360" y="378" font-size="11.5" fill="#374151">{ showForm &amp;&amp; &lt;Add Customer form /&gt; } · empty states · layout</text>

  <text x="360" y="412" font-size="11" fill="#6B7280">All shared state lives here — lifted to the closest common ancestor</text>
  <text x="360" y="430" font-size="11" fill="#6B7280">State change → re-render → new props pushed down</text>

  <!-- Presentational components -->
  <rect x="880" y="100" width="280" height="86" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="896" cy="120" r="4" fill="#10B981"/>
  <text x="908" y="125" font-size="15" font-weight="700" fill="#111827">SearchBar</text>
  <text x="1144" y="125" font-size="10" fill="#6B7280" text-anchor="end">no internal state</text>
  <text x="896" y="150" font-size="11.5" fill="#374151">props: searchTerm · onSearch</text>
  <text x="896" y="170" font-size="11" fill="#6B7280">controlled input · onChange → onSearch(value)</text>

  <rect x="880" y="226" width="280" height="100" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="896" cy="246" r="4" fill="#10B981"/>
  <text x="908" y="251" font-size="15" font-weight="700" fill="#111827">CustomerCard × N</text>
  <text x="1144" y="251" font-size="10" fill="#6B7280" text-anchor="end">no internal state</text>
  <text x="896" y="276" font-size="11.5" fill="#374151">props: customer · isSelected</text>
  <text x="896" y="294" font-size="11.5" fill="#374151">handlers: onDelete(id) · onSelect(customer)</text>
  <text x="896" y="312" font-size="11" fill="#6B7280">click → onSelect · Delete → onDelete</text>

  <rect x="880" y="376" width="280" height="86" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="896" cy="396" r="4" fill="#10B981"/>
  <text x="908" y="401" font-size="15" font-weight="700" fill="#111827">CustomerDetail</text>
  <text x="1144" y="401" font-size="10" fill="#6B7280" text-anchor="end">no internal state</text>
  <text x="896" y="426" font-size="11.5" fill="#374151">props: customer (null → placeholder)</text>
  <text x="896" y="444" font-size="11" fill="#6B7280">conditional: if (!customer) early return</text>

  <!-- Entry / data arrows -->
  <line x1="260" y1="142" x2="337" y2="142" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="300" y="134" font-size="10.5" fill="#6B7280" text-anchor="middle">renders &lt;App /&gt;</text>
  <line x1="260" y1="288" x2="337" y2="288" stroke="#D97706" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="300" y="280" font-size="10.5" fill="#6B7280" text-anchor="middle">initial seed</text>

  <!-- Props down / events up: App ↔ SearchBar -->
  <line x1="800" y1="127" x2="877" y2="127" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ah-indigo)"/>
  <text x="838" y="120" font-size="10" fill="#4F46E5" text-anchor="middle">props</text>
  <line x1="880" y1="160" x2="803" y2="160" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah-green)"/>
  <text x="838" y="174" font-size="10" fill="#059669" text-anchor="middle">events</text>

  <!-- App ↔ CustomerCard -->
  <line x1="800" y1="256" x2="877" y2="256" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ah-indigo)"/>
  <text x="838" y="249" font-size="10" fill="#4F46E5" text-anchor="middle">props</text>
  <line x1="880" y1="296" x2="803" y2="296" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah-green)"/>
  <text x="838" y="310" font-size="10" fill="#059669" text-anchor="middle">events</text>

  <!-- App → CustomerDetail -->
  <line x1="800" y1="419" x2="877" y2="419" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ah-indigo)"/>
  <text x="838" y="412" font-size="10" fill="#4F46E5" text-anchor="middle">props</text>

  <!-- Toolchain -->
  <line x1="640" y1="440" x2="818" y2="492" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah-gray)"/>
  <text x="756" y="462" font-size="10" fill="#9CA3AF" text-anchor="middle">builds src/</text>
  <rect x="620" y="496" width="540" height="56" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="640" y="520" font-size="13" font-weight="700" fill="#111827">Build &amp; tooling</text>
  <text x="640" y="540" font-size="11.5" fill="#6B7280">Vite 8 (dev / build / preview) · React 19 · CSS Modules · ESLint (react-hooks · react-refresh)</text>

  <!-- Legend -->
  <text x="60" y="512" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">LEGEND</text>
  <rect x="60" y="524" width="14" height="14" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="82" y="536" font-size="11" fill="#374151">container (state owner)</text>
  <rect x="230" y="524" width="14" height="14" rx="4" fill="#ECFDF5" stroke="#10B981"/>
  <text x="252" y="536" font-size="11" fill="#374151">presentational (props only)</text>
  <rect x="450" y="524" width="14" height="14" rx="4" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="472" y="536" font-size="11" fill="#374151">data source</text>
  <line x1="60" y1="562" x2="110" y2="562" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ah-indigo)"/>
  <text x="120" y="566" font-size="11" fill="#374151">props flow down</text>
  <line x1="250" y1="562" x2="300" y2="562" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah-green)"/>
  <text x="310" y="566" font-size="11" fill="#374151">callbacks flow up</text>
  <line x1="470" y1="562" x2="520" y2="562" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah-gray)"/>
  <text x="530" y="566" font-size="11" fill="#374151">data / build</text>

  <!-- Flow summary banner -->
  <rect x="60" y="630" width="1100" height="48" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="610" y="659" font-size="13" fill="#334155" text-anchor="middle">Unidirectional data flow:  user event  →  <tspan fill="#059669" font-weight="600">callback ↑</tspan>  →  App state  →  re-render  →  <tspan fill="#4F46E5" font-weight="600">props ↓</tspan>  →  UI</text>
</svg>
